*{box-sizing:border-box}
html,body{margin:0;height:100%}

.brand b{font-size:20px;letter-spacing:-.01em;display:block}
.brand small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600}
.input{height:44px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);width:100%}
.input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.input:disabled{background:var(--bg);color:var(--muted)}
textarea.input{height:auto;padding:10px 12px;resize:vertical;min-height:72px;line-height:1.5}
.input-wrap{display:flex;align-items:center;gap:4px;height:44px;padding:0 4px 0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface)}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.input-wrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%}
.input-wrap.big{height:52px;border-radius:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:10px;font-size:13px;background:var(--accent-soft);color:var(--accent-soft-ink)}

.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}

.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}

.nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;width:100%}

.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;gap:10px;align-items:center;padding:18px 20px 14px}

.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}

.list{flex:1;overflow:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}

.gname{font-weight:600;font-size:13px}
.gname.mono{font-weight:500}
.gmeta{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:2px;padding-right:10px;border-top:1px solid var(--line2)}

.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:56px;padding:0 4px 0 14px;border:0;background:transparent;text-align:left}

.row-name{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.row-name>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-url{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-user{width:170px;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.row.sel .badge{background:var(--surface)}
.empty{margin:auto;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:40px 0;color:var(--muted)}

.empty p{margin:0}
.foot{display:flex;align-items:center;gap:16px;min-height:52px;padding:8px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot .sec{display:flex;align-items:center;gap:6px}
.foot .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.foot .ok{display:flex;align-items:center;gap:6px}
.pill-warn{padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.foot .btn{height:34px}

.detail{background:var(--surface);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.d-head{display:flex;align-items:flex-start;gap:12px}
.d-head .tile{width:44px;height:44px;border-radius:10px;font-size:18px}
.d-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.d-title h2{margin:0;font-size:20px;overflow-wrap:anywhere}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:4px;text-align:left;overflow-wrap:anywhere}
.linkbtn:hover{text-decoration:underline}
.d-url{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.star.on{color:var(--star)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:10px}
.tab{flex:1;min-width:0;height:34px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500;color:var(--ink2);padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tabs .icon-btn{width:34px;height:34px}
.dfield{display:flex;flex-direction:column;gap:6px}
.dlabel{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.dlabel span{font-weight:500}
.dval{display:flex;align-items:center;min-height:44px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:8px;gap:2px}
.dval .v{flex:1;min-width:0;font-family:var(--mono);font-size:14px;overflow-wrap:anywhere;padding:8px 0}
.dval .v.masked{letter-spacing:.12em;font-size:16px}
.dval .v.none{color:var(--muted);font-family:var(--sans)}
.dval.pw{border-color:var(--accent)}
.notes{margin:0;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.d-actions{margin-top:auto;display:flex;gap:8px}
.d-actions .btn:first-child{flex:1}
.d-empty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:240px}
.d-empty p{margin:0}
.d-close{display:none}

.overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto;z-index:20}
.dialog{width:100%;max-width:640px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dialog.sm{max-width:460px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--line2)}
.dlg-head h2{margin:0;font-size:20px}
.dlg-body{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.dlg-foot{display:flex;align-items:center;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--line2);flex-wrap:wrap}
.dlg-foot .end{margin-left:auto;display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.match{margin:0;padding:14px 16px;border:0;background:var(--accent-soft);border-radius:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.match legend{float:left;width:100%;padding:0;margin-bottom:10px;display:flex;gap:8px;align-items:center;font-weight:600;color:var(--accent-soft-ink)}
.match .grid2{gap:8px}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--field);border-radius:8px;cursor:pointer}
.radio.on{border:2px solid var(--accent);padding:0 11px;font-weight:600}
.radio input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.meter{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:160px}
.segs i{height:6px;border-radius:3px;background:var(--line)}
.reuse{color:var(--warn-ink);font-weight:600}
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:44px;padding:6px 8px;border:1px solid var(--field);border-radius:8px;background:var(--surface);cursor:text}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tagbox input{flex:1;min-width:100px;border:0;outline:0;background:transparent;height:30px}
.chip .x{width:22px;height:22px;border:0;background:transparent;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);margin-right:-4px;padding:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--toast-bg);color:var(--toast-ink);border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .18s,transform .18s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .cd{font-family:var(--mono);font-size:12px;opacity:.75}

.only-narrow{display:none !important}
@media (max-width:1100px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:10;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s}
  .detail.open{transform:none}
  .d-close{display:inline-flex}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .row-user{display:none}

  .grid2{grid-template-columns:minmax(0,1fr)}
  .topbar .btn .lbl{display:none}

.dialog.wide{max-width:1040px}
select{font:inherit;color:inherit}
.select{height:38px;width:100%;border:1px solid var(--field);border-radius:8px;background:var(--surface);padding:0 8px;font-weight:600;font-size:13px}
.select.set{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.steps{margin:0;padding:0;list-style:none;display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.steps .dot{width:24px;height:24px;border-radius:999px;border:1px solid var(--field);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.steps li.done .dot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li.cur .dot{background:var(--accent);color:var(--on-accent);border-color:transparent}
.steps .bar{width:24px;height:1px;background:var(--field)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:212px;padding:20px;border:2px dashed var(--field);border-radius:12px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop strong{color:var(--ink)}
.imp-status{margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.imp-status.bad{color:var(--danger)}
.imp-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.imp-opts{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.imp-table{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:430px;background:var(--surface)}
.imp-grid{display:grid;min-width:100%}
.imp-head{padding:12px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);position:sticky;top:0;min-width:0}
.imp-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-cell{padding:0 12px;line-height:40px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-cell.off{color:var(--muted);opacity:.6}
.imp-more{grid-column:1/-1;padding:12px;font-size:13px;color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stats h3{margin:0;font-size:15px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px}
.stat b{font-size:20px}
.stat.warn{color:var(--warn-ink)}
.imp-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.imp-li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);min-width:0}
.imp-li:first-child{border-top:0}
.imp-li .row-txt{min-width:0}
@media (max-width:860px){.imp-wrap{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<script>
(() => {
'use strict';

/* ================================================================
   Local Hostage · a password manager in a single HTML file
   Everything stays local. The CSP above blocks every network request.
   ================================================================ */

// A copy of the file as it was loaded, taken before we touch the DOM.
// Every save builds the new file from it.
const TEMPLATE = '<!doctype html>\n' + document.documentElement.outerHTML;

const VERSION = '0.3.1';
const KDF_ITER = 600000;              // PBKDF2-SHA256, OWASP recommendation
const AUTO_LOCK_MS = 5 * 60 * 1000;
const CLIP_CLEAR_MS = 20 * 1000;
const MIN_MASTER = 10;
const NONE = '\u0000none';
const enc = new TextEncoder();
const dec = new TextDecoder();
// Bound to every ciphertext. Kept from the project's first name (Kleidi):
// changing it would make every existing vault impossible to open.
const AAD = enc.encode('kleidi-vault-v1');
const FORMAT = 'local-hostage';
const FORMATS_READ = [FORMAT, 'kleidi']; // 'kleidi' = vaults saved before the rename

/* ---------------- Crypto ---------------- */

const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

const SLD = new Set(['co', 'com', 'org', 'net', 'gov', 'edu', 'ac', 'gv', 'or', 'ne', 'mil', 'sch', 'nic']);

function visibleEntries() {
  let list = S.data.entries;
  const f = S.view.filter;
  if (f.type === 'fav') list = list.filter((e) => e.favorite);
  else if (f.type === 'recent') list = [...list].sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 10);
  else if (f.type === 'domain') list = list.filter((e) => meta(e).group === f.value);
  else if (f.type === 'host') list = list.filter((e) => meta(e).host === f.value);
  else if (f.type === 'tag') list = list.filter((e) => (e.tags || []).includes(f.value));
  const toks = norm(S.view.q).split(/\s+/).filter(Boolean);
  if (toks.length) list = list.filter((e) => {
    const hay = norm([e.name, e.url, ...(e.tags || []), ...e.accounts.flatMap((a) => [a.label, a.username, a.notes])].join(' '));
    return toks.every((t) => hay.includes(t));
  });
  return list;
}

function openEntryDialog(mode, entryId, accId) {
  const entry = entryId ? S.data.entries.find((x) => x.id === entryId) : null;
  if (mode !== 'new' && !entry) return;
  const acc = mode === 'edit' ? (entry.accounts.find((x) => x.id === accId) || entry.accounts[0]) : null;
  let match = mode === 'addAcc' ? entry : null;
  let attach = mode === 'addAcc';
  let lastMatchId = match ? match.id : null;
  let nameTouched = mode !== 'new';
  let tags = entry ? [...(entry.tags || [])] : [];

  const urlIn = h('input', { class: 'input mono', id: 'f-url', type: 'text', inputmode: 'url', autocomplete: 'off', spellcheck: 'false', placeholder: 'https://crm.example.com/login', value: entry ? entry.url || '' : '', disabled: mode === 'addAcc' });
  const urlHint = h('span', { class: 'hint' });
  const nameIn = h('input', { class: 'input', id: 'f-name', type: 'text', autocomplete: 'off', placeholder: 'e.g. CRM', value: entry ? entry.name : '', disabled: mode === 'addAcc', oninput: () => { nameTouched = true; } });
  const labelIn = h('input', { class: 'input', id: 'f-label', type: 'text', autocomplete: 'off', placeholder: 'e.g. Admin', value: acc ? acc.label || '' : '' });
  const userIn = h('input', { class: 'input mono', id: 'f-user', type: 'text', autocomplete: 'off', spellcheck: 'false', value: acc ? acc.username || '' : '' });
  const pwIn = h('input', { id: 'f-pw', type: 'password', class: 'mono', autocomplete: 'new-password', spellcheck: 'false', value: acc ? acc.password || '' : '' });
  const notesIn = h('textarea', { class: 'input', id: 'f-notes', rows: 3 });
  notesIn.value = acc ? acc.notes || '' : '';
  const matchBox = h('div');
  const segs = h('div', { class: 'segs', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i'));
  const meterTxt = h('span');
  const err = h('p', { class: 'err', role: 'alert' });
  const tagInput = h('input', { type: 'text', id: 'f-tags', placeholder: tags.length ? '' : 'Add…', list: 'tag-list', autocomplete: 'off' });
  const tagBox = h('div', { class: 'tagbox', onclick: () => tagInput.focus() });
  const eye = h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Show password', onclick: () => { pwIn.type = pwIn.type === 'password' ? 'text' : 'password'; eye.replaceChildren(icon(pwIn.type === 'password' ? 'eye' : 'eyeOff', 16)); } }, icon('eye', 16));
  const gen = h('button', { type: 'button', class: 'btn md', onclick: () => { pwIn.value = genPassword(); pwIn.type = 'text'; eye.replaceChildren(icon('eyeOff', 16)); onPw(); } }, icon('refresh', 16), 'Generate');

  function renderTags() {
    tagBox.replaceChildren(...tags.map((t) => h('span', { class: 'chip' }, t,
      h('button', { type: 'button', class: 'x', 'aria-label': `Remove ${t}`, onclick: (ev) => { ev.stopPropagation(); tags = tags.filter((x) => x !== t); renderTags(); tagInput.focus(); } }, icon('x', 12)))), tagInput);
    tagInput.placeholder = tags.length ? '' : 'Add…';
  }
  function addTag(v) {
    v = v.replace(/,/g, '').trim();
    if (v && !tags.includes(v)) tags.push(v);
    tagInput.value = ''; renderTags(); tagInput.focus();
  }
  tagInput.addEventListener('keydown', (ev) => {
    if ((ev.key === 'Enter' && !ev.ctrlKey && !ev.metaKey) || ev.key === ',') { ev.preventDefault(); if (tagInput.value.trim()) addTag(tagInput.value); }
    else if (ev.key === 'Backspace' && !tagInput.value && tags.length) { tags.pop(); renderTags(); tagInput.focus(); }
  });

  function applyAttach() {
    if (attach && match) { nameIn.disabled = true; nameIn.value = match.name; tags = [...(match.tags || [])]; }
    else if (mode === 'new') { nameIn.disabled = false; if (!nameTouched) nameIn.value = guessName(parseUrl(urlIn.value)); }
    renderTags();
  }
  function renderMatch() {
    matchBox.replaceChildren();
    if (!match) return;
    const n = match.accounts.length;
    const radio = (val, text) => {
      const inp = h('input', { type: 'radio', name: 'f-mode', checked: attach === val, onchange: () => { attach = val; renderMatch(); applyAttach(); } });
      return h('label', { class: 'radio' + (attach === val ? ' on' : '') }, inp, text);
    };
    const labels = match.accounts.map(accLabel).join(', ');
    matchBox.append(h('fieldset', { class: 'match' },
      h('legend', null, icon('info', 16), `"${match.name}" already exists${n > 1 ? ` with ${n} accounts (${labels})` : ` (${labels})`}`),
      h('div', { class: 'grid2' }, radio(true, `Add as ${ordinal(n + 1)} account`), radio(false, 'Separate entry'))));
  }
  function onUrl() {
    const raw = urlIn.value.trim();
    const p = parseUrl(raw);
    const ok = !!p && !isIP(p.host) && p.host.includes('.');
    fill(urlHint, ...(ok
      ? ['Group: ', h('span', { class: 'mono' }, p.domain), p.sub ? [' · subdomain ', h('span', { class: 'mono' }, p.sub)] : null]
      : [raw ? 'Does not look like a web address. It will go in the "No URL" group.' : 'Optional. For VPN, Wi‑Fi or desktop apps, write whatever helps, e.g. an IP.']));
    if (mode !== 'new') return;
    const host = p ? p.host : '';
    match = host ? S.data.entries.find((x) => meta(x).host === host) || null : null;
    if ((match ? match.id : null) !== lastMatchId) { attach = !!match; lastMatchId = match ? match.id : null; }
    renderMatch(); applyAttach();
  }
  function onPw() {
    const s = strength(pwIn.value);
    const cols = ['', 'var(--danger)', 'var(--warn-ink)', 'var(--accent)', 'var(--accent)'];
    [...segs.children].forEach((el, i) => { el.style.background = i < s ? cols[s] : ''; });
    meterTxt.replaceChildren();
    if (!pwIn.value) { meterTxt.append('Type or generate a password'); return; }
    const used = reuseOf(pwIn.value, acc && acc.id);
    meterTxt.append(h('strong', null, ['', 'Weak', 'Fair', 'Good', 'Strong'][s]), ` · ${[...pwIn.value].length} characters · `,
      used.length ? h('span', { class: 'reuse' }, `same as: ${used.slice(0, 2).join(', ')}${used.length > 2 ? '…' : ''}`) : 'not used anywhere else');
  }
  urlIn.addEventListener('input', onUrl);
  pwIn.addEventListener('input', onPw);

  async function submit() {
    err.textContent = '';
    if (tagInput.value.trim()) addTag(tagInput.value);
    const name = nameIn.value.trim(), url = urlIn.value.trim(), label = labelIn.value.trim(),
      username = userIn.value.trim(), password = pwIn.value, notes = notesIn.value.trim();
    if (!(attach && match) && !name) { err.textContent = 'Enter a platform name.'; nameIn.focus(); return; }
    if (!username && !password) { err.textContent = 'Fill in at least a username or a password.'; userIn.focus(); return; }
    const now = Date.now();
    let target, targetAcc;
    if (mode === 'edit') {
      target = entry;
      target.name = name; target.url = url; target.tags = tags;
      targetAcc = acc;
      if (acc.password !== password) acc.changed = now;
      Object.assign(acc, { label, username, password, notes });
    } else {
      targetAcc = { id: uid(), label, username, password, notes, changed: now };
      if (attach && match) { target = match; target.accounts.push(targetAcc); target.tags = tags; }
      else { target = { id: uid(), name, url, tags, favorite: false, created: now, accounts: [targetAcc] }; S.data.entries.push(target); }
    }
    target.updated = now;
    closeDialog();
    S.view.selId = target.id; S.view.acc[target.id] = targetAcc.id; S.view.reveal = false;
    await commit();
    toast(mode === 'edit' ? 'Entry updated' : attach && match ? 'Account added' : 'Entry added');
  }

  function deleteAccount() {
    const i = entry.accounts.indexOf(acc);
    if (!confirm(`Delete the account "${accLabel(acc, i)}" from "${entry.name}"?`)) return;
    entry.accounts.splice(i, 1); entry.updated = Date.now();
    delete S.view.acc[entry.id];
    closeDialog(); commit(); toast('Account deleted');
  }

  const body = h('div', { class: 'dlg-body' },
    h('div', { class: 'field' }, h('label', { for: 'f-url' }, 'Address (URL)'), urlIn, urlHint),
    matchBox,
    h('div', { class: 'grid2' },
      h('div', { class: 'field' }, h('label', { for: 'f-name' }, 'Platform'), nameIn),
      h('div', { class: 'field' }, h('label', { for: 'f-label' }, 'Account name'), labelIn, h('span', { class: 'hint' }, 'Shown as a tab on the entry'))),
    h('div', { class: 'field' }, h('label', { for: 'f-user' }, 'Username'), userIn),
    h('div', { class: 'field' }, h('label', { for: 'f-pw' }, 'Password'),
      h('div', { style: 'display:flex;gap:8px' }, h('div', { class: 'input-wrap', style: 'flex:1;min-width:0' }, pwIn, eye), gen),
      h('div', { class: 'meter' }, segs, meterTxt)),
    h('div', { class: 'field' }, h('label', { for: 'f-notes' }, 'Notes ', h('span', { class: 'hint' }, '(for this account)')), notesIn),
    h('div', { class: 'field' }, h('label', { for: 'f-tags' }, 'Tags'), tagBox),
    h('datalist', { id: 'tag-list' }, allTags().map((t) => h('option', { value: t }))),
    err);

  const foot = h('div', { class: 'dlg-foot' },
    mode === 'edit' && entry.accounts.length > 1
      ? h('button', { type: 'button', class: 'btn danger', onclick: deleteAccount }, 'Delete account')
      : h('span', { class: 'hint' }, kbd('Esc'), ' cancel'),
    h('div', { class: 'end' },
      h('button', { type: 'button', class: 'btn md', onclick: closeDialog }, 'Cancel'),
      h('button', { type: 'button', class: 'btn primary md', onclick: submit }, 'Save', kbd('Ctrl ↵'))));

  const titles = { new: 'New entry', edit: `Edit: ${entry ? entry.name : ''}`, addAcc: `New account: ${entry ? entry.name : ''}` };
  openDialog({ title: titles[mode], body, foot, submit, focus: mode === 'addAcc' ? labelIn : urlIn });
  onUrl(); onPw(); renderTags();
}

function openMasterDialog() {
  const cur = h('input', { class: 'input mono', type: 'password', id: 'm-cur', autocomplete: 'current-password' });
  const n1 = h('input', { class: 'input mono', type: 'password', id: 'm-n1', autocomplete: 'new-password' });
  const n2 = h('input', { class: 'input mono', type: 'password', id: 'm-n2', autocomplete: 'new-password' });
  const err = h('p', { class: 'err', role: 'alert' });
  const btn = h('button', { type: 'button', class: 'btn primary md', onclick: () => submit() }, 'Change password');
  async function submit() {
    err.textContent = '';
    if ([...n1.value].length < MIN_MASTER) { err.textContent = `The new password needs at least ${MIN_MASTER} characters.`; n1.focus(); return; }
    if (n1.value !== n2.value) { err.textContent = 'The two new passwords do not match.'; n2.focus(); return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    try { await decryptData(await deriveKey(cur.value, S.salt, S.iter), S.payload); }
    catch { err.textContent = 'The current password is wrong.'; btn.disabled = false; btn.textContent = 'Change password'; cur.select(); return; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    S.key = await deriveKey(n1.value, salt, KDF_ITER); S.salt = salt; S.iter = KDF_ITER;
    closeDialog();
    await commit();
    toast(S.fileHandle ? 'Master password changed' : 'Master password changed. Save the file.', 4000);
  }
  openDialog({
    title: 'Change master password', small: true, submit,

}

/* ---------------- Import: parsers ---------------- */

// Delimited text (pasting from Excel gives TSV, .csv files use , or ;)
function parseDelimited(text) {
  text = (text || '').replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  let d = '\t', best = 0;
  for (const c of ['\t', ';', ',']) {
    let n = 0, q = false;
    for (const ch of firstLine) { if (ch === '"') q = !q; else if (ch === c && !q) n++; }
    if (n > best) { best = n; d = c; }
  }
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"' && field === '') q = true;
    else if (c === d) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Excel often saves CSV in the system's legacy code page, not UTF-8.
// Guess that code page from the browser language.
const LEGACY_CP = { el: 'windows-1253', ru: 'windows-1251', uk: 'windows-1251', bg: 'windows-1251', sr: 'windows-1251', pl: 'windows-1250', cs: 'windows-1250', sk: 'windows-1250', hu: 'windows-1250', ro: 'windows-1250', hr: 'windows-1250', sl: 'windows-1250', tr: 'windows-1254' };
function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch {
    const lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    try { return new TextDecoder(LEGACY_CP[lang] || 'windows-1252').decode(buf); } catch { return new TextDecoder('windows-1252').decode(buf); }
  }
}

// Minimal zip reader built on the browser's native DecompressionStream
function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('bad-zip');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const files = new Map();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(off, true) !== 0x02014b50) throw new Error('bad-zip');
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    files.set(dec.decode(u8.subarray(off + 46, off + 46 + nl)), { method, csize, lho });
    off += 46 + nl + el + cl;
  }
  return {
    async text(name) {
      const f = files.get(name);
      if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const data = u8.subarray(start, start + f.csize);
      if (f.method === 0) return dec.decode(data);
      if (f.method !== 8) throw new Error('bad-zip');
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return dec.decode(out);
    },
  };
}

async function readXlsx(buf) {
  const z = readZip(buf);
  const xml = (s) => (s ? new DOMParser().parseFromString(s, 'application/xml') : null);
  const tags = (node, name) => [...node.getElementsByTagName(name)];
  const wb = xml(await z.text('xl/workbook.xml'));
  if (!wb) throw new Error('not-xlsx');
  const rels = xml(await z.text('xl/_rels/workbook.xml.rels'));
  const relMap = new Map(rels ? tags(rels, 'Relationship').map((r) => [r.getAttribute('Id'), r.getAttribute('Target')]) : []);
  const sheets = tags(wb, 'sheet').map((s, i) => {
    let t = relMap.get(s.getAttribute('r:id')) || `worksheets/sheet${i + 1}.xml`;
    t = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
    return { name: s.getAttribute('name') || `Sheet ${i + 1}`, path: t };
  });
  const ssDoc = xml(await z.text('xl/sharedStrings.xml'));
  const shared = ssDoc ? tags(ssDoc, 'si').map((si) => tags(si, 't').filter((t) => t.parentNode.nodeName !== 'rPh').map((t) => t.textContent).join('')) : [];
  const colIdx = (ref) => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
  async function load(i) {
    const doc = xml(await z.text(sheets[i].path));
    if (!doc) return [];
    const rows = [];
    for (const r of tags(doc, 'row')) {
      const ri = (Number(r.getAttribute('r')) || rows.length + 1) - 1;
      const arr = []; let ci = 0;
      for (const c of tags(r, 'c')) {
        const ref = c.getAttribute('r'); if (ref) ci = colIdx(ref);
        const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0];
        let v = '';
        if (t === 's') v = vEl ? shared[Number(vEl.textContent)] ?? '' : '';
        else if (t === 'inlineStr') v = tags(c, 't').map((x) => x.textContent).join('');
        else if (vEl) v = vEl.textContent;
        if (t === 'b') v = v === '1' ? 'TRUE' : 'FALSE';
        arr[ci] = v; ci++;
      }
      rows[ri] = arr;
    }
    return Array.from(rows, (r) => Array.from(r || [], (x) => x ?? ''));
  }
  return { sheets, load };
}

function tidyRows(rows) {
  rows = rows.map((r) => r.map((c) => String(c ?? '')));
  rows = rows.filter((r) => r.some((c) => c.trim()));
  let w = 0;
  for (const r of rows) { let n = r.length; while (n && !r[n - 1].trim()) n--; w = Math.max(w, n); }
  return rows.map((r) => Array.from({ length: w }, (_, i) => r[i] ?? ''));
}

const FIELDS = [['skip', 'Ignore'], ['name', 'Platform'], ['url', 'URL'], ['username', 'Username'], ['password', 'Password'], ['label', 'Account name'], ['notes', 'Notes'], ['tags', 'Tags']];
const FIELD_NAME = Object.fromEntries(FIELDS);
// Header names recognised on import, in English and Greek (accents are stripped before matching)
const SYN = {
  password: ['κωδικος', 'κωδ', 'συνθηματικο', 'pass', 'password', 'passwd', 'pwd', 'pin', 'κλειδι'],
  username: ['χρηστης', 'ονομα χρηστη', 'username', 'user', 'user name', 'login', 'email', 'e-mail', 'mail', 'λογαριασμος', 'account', 'id'],
  url: ['url', 'link', 'λινκ', 'συνδεσμος', 'διευθυνση', 'website', 'web', 'site', 'domain', 'address', 'ip'],
  name: ['πλατφορμα', 'συστημα', 'εφαρμογη', 'υπηρεσια', 'ονομα', 'εργαλειο', 'platform', 'system', 'service', 'app', 'application', 'name', 'title', 'tool'],
  label: ['ρολος', 'τυπος', 'role', 'type', 'label', 'επιπεδο', 'access'],
  notes: ['σχολια', 'σημειωσεις', 'παρατηρησεις', 'notes', 'note', 'comments', 'comment', 'info', 'πληροφοριες'],
  tags: ['ετικετες', 'tags', 'tag', 'χωρα', 'country', 'market', 'αγορα', 'κατηγορια', 'category', 'ομαδα', 'group', 'τμημα', 'department'],
};
function headerField(cell) {
  const c = norm(cell).replace(/[_.:#*()]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!c) return null;
  for (const f of ['password', 'username', 'url', 'name', 'label', 'notes', 'tags']) if (SYN[f].some((s) => c === s)) return f;
  for (const f of ['password', 'username', 'url', 'notes', 'tags', 'label', 'name']) if (SYN[f].some((s) => s.length > 3 && c.includes(s))) return f;
  return null;
}
function detectHeader(rows) { return rows.length > 1 && rows[0].some((c) => headerField(c)); }
function guessMap(rows, header) {
  const w = rows[0] ? rows[0].length : 0;
  const map = Array(w).fill('skip');
  const taken = new Set();
  const multi = new Set(['notes', 'tags']);
  if (header) rows[0].forEach((c, i) => { const f = headerField(c); if (f && (multi.has(f) || !taken.has(f))) { map[i] = f; taken.add(f); } });
  const sample = rows.slice(header ? 1 : 0, 40);
  const ratio = (i, test) => { const vals = sample.map((r) => r[i].trim()).filter(Boolean); return vals.length ? vals.filter(test).length / vals.length : 0; };
  const looksUrl = (v) => !v.includes('@') && !!parseUrl(v) && (/^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(v)) && /\.[a-z]{2,}(\/|$|:)|^\d+\.\d+\.\d+\.\d+/i.test(v.replace(/^https?:\/\//i, ''));
  const looksMail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  for (let i = 0; i < w; i++) {
    if (map[i] !== 'skip') continue;
    if (!taken.has('url') && ratio(i, looksUrl) >= 0.6) { map[i] = 'url'; taken.add('url'); }
    else if (!taken.has('username') && ratio(i, looksMail) >= 0.6) { map[i] = 'username'; taken.add('username'); }
  }
  // No headers: the most common order is platform, url, username, password
  if (!header) for (const f of ['name', 'username', 'password']) {
    if (taken.has(f)) continue;
    const i = map.indexOf('skip');
    if (i < 0) break;
    map[i] = f; taken.add(f);
  }
  return map;
}

/* ---------------- Import: wizard ---------------- */

function openImport() {
  const st = { step: 1, rows: [], header: false, map: [], merge: true, pasted: '', xlsx: null, sheetIdx: 0, source: '', err: '', tag: '' };
  const body = h('div', { class: 'dlg-body' });
  const foot = h('div', { class: 'dlg-foot' });
  const statusEl = h('p', { class: 'imp-status', role: 'status' });
  const nextBtn = h('button', { type: 'button', class: 'btn primary md', onclick: () => next() });
  const backBtn = h('button', { type: 'button', class: 'btn md', onclick: () => { st.step--; render(); } }, 'Back');
  const cancelBtn = h('button', { type: 'button', class: 'btn md', onclick: closeDialog }, 'Cancel');

  const dataRows = () => (st.header ? st.rows.slice(1) : st.rows);
  const colName = (i) => { let s = '', n = i + 1; while (n) { s = String.fromCharCode(65 + ((n - 1) % 26)) + s; n = Math.floor((n - 1) / 26); } return s; };

  function setRows(rows, source) {
    st.rows = tidyRows(rows);
    st.source = source;
    st.err = st.rows.length ? '' : 'No data found.';
    st.header = detectHeader(st.rows);
    st.map = guessMap(st.rows, st.header);
  }

  function plan() {
    const cols = (f) => st.map.reduce((a, m, i) => (m === f ? a.concat(i) : a), []);
    const C = Object.fromEntries(FIELDS.map(([f]) => [f, cols(f)]));
    const one = (r, f) => { for (const i of C[f]) { const v = (r[i] || '').trim(); if (v) return v; } return ''; };
    const many = (r, f) => C[f].map((i) => (r[i] || '').trim()).filter(Boolean);
    const keyOf = (name, url) => { const p = parseUrl(url); return p ? 'h:' + p.host : url ? 'u:' + norm(url) : 'n:' + norm(name); };
    const existing = new Map();
    for (const e of S.data.entries) { const k = keyOf(e.name, e.url); if (!existing.has(k)) existing.set(k, e); }
    const same = (accs, a) => accs.some((x) => x.username === a.username && x.password === a.password);
    const fresh = new Map(), adds = new Map();
    let dups = 0, skipped = 0, ok = 0;
    for (const r of dataRows()) {
      const url = one(r, 'url');
      let name = one(r, 'name');
      const acc = { label: one(r, 'label'), username: one(r, 'username'), password: one(r, 'password'), notes: many(r, 'notes').join('\n') };
      const tags = many(r, 'tags').flatMap((t) => t.split(/[,;]/)).map((t) => t.trim()).filter(Boolean);
      if (!acc.username && !acc.password) { skipped++; continue; }
      if (!name) name = guessName(parseUrl(url)) || url;
      if (!name) { skipped++; continue; }
      const key = keyOf(name, url);
      const ex = existing.get(key);
      if (ex && same(ex.accounts, acc)) { dups++; continue; }
      if (st.merge && ex) {
        const slot = adds.get(ex) || { entry: ex, accounts: [], tags: [] };
        if (same(slot.accounts, acc)) { dups++; continue; }
        if (!acc.label && norm(name) !== norm(ex.name)) acc.label = name;
        slot.accounts.push(acc); slot.tags.push(...tags); adds.set(ex, slot); ok++;
        continue;
      }
      const fk = st.merge ? key : key + '#' + ok;
      let f = fresh.get(fk);
      if (!f) { f = { name, url, tags: [], accounts: [] }; fresh.set(fk, f); }
      else {
        if (same(f.accounts, acc)) { dups++; continue; }
        if (!acc.label && norm(name) !== norm(f.name)) acc.label = name;
      }
      f.accounts.push(acc); f.tags.push(...tags); ok++;
    }
    const uniq = (a) => [...new Set(a)];
    const fr = [...fresh.values()].map((f) => ({ ...f, tags: uniq(f.tags) }));
    const ad = [...adds.values()].map((s) => ({ ...s, tags: uniq(s.tags) }));
    return {
      fresh: fr, adds: ad, dups, skipped, ok, total: dataRows().length,
      multi: fr.filter((f) => f.accounts.length > 1).length,
      addAccs: ad.reduce((n, s) => n + s.accounts.length, 0),
      hasPw: C.password.length > 0, hasId: C.name.length + C.url.length > 0,
    };
  }

  function statsCard(p, title) {
    const stat = (label, n, cls) => h('div', { class: 'stat' + (cls ? ' ' + cls : '') }, h('span', null, label), h('b', null, String(n)));
    return h('div', { class: 'stats' },
      h('h3', null, title),
      stat('New entries', p.fresh.length),
      p.multi ? stat('With 2+ accounts', p.multi) : null,
      p.addAccs ? stat('Added to existing entries', p.addAccs) : null,
      p.dups ? stat('Already in the vault, skipped', p.dups, 'warn') : null,
      p.skipped ? stat('No username or password, skipped', p.skipped, 'warn') : null,
      !p.hasPw ? h('p', { class: 'hint', style: 'margin:0;color:var(--warn-ink)' }, 'No column is set to "Password".') : null,
      !p.hasId ? h('p', { class: 'hint', style: 'margin:0;color:var(--warn-ink)' }, 'Pick a "Platform" or "URL" column.') : null);
  }

  function stepsBar() {
    const names = ['Paste', 'Map columns', 'Review'];
    return h('ol', { class: 'steps', 'aria-label': 'Steps' }, names.map((n, i) => [
      i ? h('li', { class: 'bar', 'aria-hidden': 'true' }) : null,
      h('li', { class: i + 1 < st.step ? 'done' : i + 1 === st.step ? 'cur' : '', 'aria-current': i + 1 === st.step ? 'step' : null },
        h('span', { class: 'dot' }, i + 1 < st.step ? icon('check', 12) : String(i + 1)), n)]));
  }

  function updateStatus() {
    statusEl.className = 'imp-status' + (st.err ? ' bad' : '');
    fill(statusEl,
      st.err ? [icon('alert', 16), st.err]
        : st.rows.length ? [icon('check', 16), `${st.source}: ${plural(st.rows[0].length, 'column', 'columns')}, ${plural(st.rows.length, 'row', 'rows')}`]
          : null);
    nextBtn.disabled = !st.rows.length;
  }

  async function handleFile(file) {
    if (!file) return;
    st.err = ''; st.xlsx = null; st.sheetIdx = 0;
    try {
      const buf = await file.arrayBuffer();
      const u8 = new Uint8Array(buf.slice(0, 4));
      if (u8[0] === 0xd0 && u8[1] === 0xcf && u8[2] === 0x11 && u8[3] === 0xe0) {
        st.rows = [];
        st.err = 'This is an old .xls or a password-protected file. Save it as .xlsx without a password, or copy and paste instead.';
      } else if (u8[0] === 0x50 && u8[1] === 0x4b) {
        st.xlsx = await readXlsx(buf);
        let rows = [];

        setRows(rows, file.name);
      } else {
        setRows(parseDelimited(decodeText(buf)), file.name);
      }
    } catch {
      st.rows = []; st.err = 'Could not read the file. Try copying and pasting from Excel instead.';
    }
    st.pasted = '';
    if (UI.impTa) UI.impTa.value = '';
    updateStatus();
    if (st.rows.length) { st.step = 2; render(); }
  }

  function renderStep1() {
    const ta = UI.impTa = h('textarea', { class: 'input mono', id: 'imp-ta', rows: 9, spellcheck: 'false', autocomplete: 'off', placeholder: 'In Excel: select the cells including the headers, Ctrl C.\nHere: Ctrl V.' });
    ta.value = st.pasted;
    ta.addEventListener('input', () => {
      st.pasted = ta.value; st.xlsx = null; st.err = '';

      updateStatus();
    });
    const fileIn = h('input', { type: 'file', accept: '.xlsx,.csv,.tsv,.txt', onchange: (e) => handleFile(e.target.files[0]) });
    const drop = h('label', { class: 'drop' }, fileIn, icon('sheet', 28), h('strong', null, 'Choose a file'), h('span', null, '.xlsx or .csv · or drop it here'));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
    fill(body, stepsBar(),
      h('div', { class: 'grid2', style: 'grid-template-columns:minmax(0,3fr) minmax(0,2fr)' },
        h('div', { class: 'field' }, h('label', { for: 'imp-ta' }, 'Paste from Excel'), ta),
        h('div', { class: 'field' }, h('span', { style: 'font-size:13px;font-weight:600' }, 'Or from a file'), drop)),
      statusEl,
      h('div', { class: 'note' }, icon('shield', 18), h('span', null, 'The file is read only here, in your browser. It is never uploaded anywhere.')));
    fill(nextBtn, 'Continue', kbd('Ctrl ↵'));
    fill(foot, h('span', { class: 'hint' }, kbd('Esc'), ' cancel'), h('div', { class: 'end' }, cancelBtn, nextBtn));
    updateStatus();

  function renderStep2() {

    const heads = rows[0].map((c, i) => {

        onchange: (e) => { st.map[i] = e.target.value; renderStep2(); const el = body.querySelectorAll('.imp-head select')[i]; if (el) el.focus(); } },
        FIELDS.map(([v, t]) => h('option', { value: v }, t)));

      return h('div', { class: 'imp-head' }, h('span', { title: st.header ? c : '' }, `Column ${colName(i)}${st.header && c.trim() ? ` · "${c.trim()}"` : ''}`), sel);
    });

      const f = st.map[i];
      const shown = f === 'password' && v ? '•'.repeat(8) : v;

    }));

    const headerCb = h('input', { type: 'checkbox', checked: st.header, onchange: (e) => { st.header = e.target.checked; renderStep2(); const el = body.querySelector('.imp-opts input'); if (el) el.focus(); } });

  function renderStep3() {

    const items = [
      ...p.fresh.map((f) => ({ name: f.name, url: f.url, n: f.accounts.length, what: 'new' })),
      ...p.adds.map((s) => ({ name: s.entry.name, url: s.entry.url, n: s.accounts.length, what: 'existing' })),
    ];
    const list = h('div', { class: 'imp-list' }, items.slice(0, 7).map((it) => {
      const pp = parseUrl(it.url);
      return h('div', { class: 'imp-li' },
        h('span', { class: 'tile', style: `background:${tileColor(it.name)}` }, initial(it.name)),
        h('span', { class: 'row-txt' }, h('span', { class: 'row-name' }, h('span', null, it.name)), h('span', { class: 'row-url' }, pp ? pp.display : it.url || '·')),
        h('span', { class: 'badge' }, it.what === 'new' ? plural(it.n, 'account', 'accounts') : `+${plural(it.n, 'account', 'accounts')}`),
        h('span', { class: 'hint', style: 'width:84px;text-align:right' }, it.what));
    }), items.length > 7 ? h('div', { class: 'imp-li hint' }, `+ ${items.length - 7} more`) : null);

    fill(body, stepsBar(),
      h('div', { class: 'imp-wrap' },
        h('div', { style: 'display:flex;flex-direction:column;gap:16px;min-width:0' },
          h('label', { class: 'check' }, mergeCb, h('span', null, h('strong', null, 'Merge accounts of the same platform. '), 'Rows with the same URL (or the same name when there is no URL) become one entry with tabs.')),
          h('div', { class: 'field' }, h('label', { for: 'imp-tag' }, 'Tag everything imported ', h('span', { class: 'hint' }, '(optional, helps you review afterwards)')), tagIn),
          list),
        h('div', { style: 'display:flex;flex-direction:column;gap:16px' },
          statsCard(p, 'Summary'),
          h('div', { class: 'note warn', style: 'align-items:flex-start' }, icon('alert', 18),
            h('span', null, 'After importing, delete the Excel file and empty the recycle bin. Otherwise the passwords stay readable on your disk.')))));
    nextBtn.disabled = p.ok === 0;
    fill(nextBtn, `Import ${plural(p.ok, 'account', 'accounts')}`, kbd('Ctrl ↵'));
    fill(foot, backBtn, h('div', { class: 'end' }, cancelBtn, nextBtn));
  }

  function render() { [renderStep1, renderStep2, renderStep3][st.step - 1](); }

  async function apply() {
    const p = plan();
    if (!p.ok) return;
    const now = Date.now(), tag = st.tag.trim();
    const withTag = (arr) => [...new Set([...arr, ...(tag ? [tag] : [])])];
    const mk = (a) => ({ id: uid(), label: a.label, username: a.username, password: a.password, notes: a.notes, changed: now });
    for (const f of p.fresh) S.data.entries.push({ id: uid(), name: f.name, url: f.url, tags: withTag(f.tags), favorite: false, created: now, updated: now, accounts: f.accounts.map(mk) });
    for (const s of p.adds) { s.entry.accounts.push(...s.accounts.map(mk)); s.entry.tags = withTag([...(s.entry.tags || []), ...s.tags]); s.entry.updated = now; }
    closeDialog();
    S.view.selId = null; S.view.q = ''; if (UI.search) UI.search.value = '';
    S.view.filter = tag ? { type: 'tag', value: tag } : { type: 'all' };
    await commit();
    toast(`Imported ${plural(p.ok, 'account', 'accounts')}. Now delete the Excel file.`, 5000);
  }

  function next() {
    if (nextBtn.disabled) return;
    if (st.step < 3) { st.step++; render(); } else apply();
  }

  openDialog({ title: 'Import from Excel', body, foot, wide: true, submit: next, onClose: () => { st.rows = []; st.pasted = ''; UI.impTa = null; } });
  render();
}

/* ---------------- Global events ---------------- */

let lastBump = 0;
for (const ev of ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel']) {
  window.addEventListener(ev, () => { const n = Date.now(); if (n - lastBump > 1000) { lastBump = n; bump(); } }, { passive: true });
}

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); if (S.payload && (S.dirty || S.data)) save(); return; }
  if (!S.data) return;
  if (S.dialog) {
    if (e.key === 'Escape') { e.preventDefault(); closeDialog(); }
    else if (mod && e.key === 'Enter') { e.preventDefault(); S.dialog.submit(); }
    return;
  }
  if ((mod && k === 'k') || (e.key === '/' && !isTyping(e.target))) { e.preventDefault(); UI.search.focus(); UI.search.select(); }
  else if (k === 'n' && !mod && !e.altKey && !isTyping(e.target)) { e.preventDefault(); openEntryDialog('new'); }
  else if (e.key === 'Escape' && S.view.selId && !isTyping(e.target)) { S.view.selId = null; renderList(); renderDetail(); }
});

window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
setInterval(tick, 1000);

/* ---------------- Startup ---------------- */

UI.app = document.getElementById('app');
document.body.append(toastEl);
if (!window.crypto || !crypto.subtle) {
  UI.app.append(h('div', { class: 'lock' }, h('div', { class: 'lock-card' }, h('h1', null, 'Not supported'),
    h('p', { class: 'lead' }, 'This browser has no Web Crypto. Open the file in a recent Chrome, Edge or Firefox.'))));
  return;
}
renderLock();
})();
</script>
</body>
